# .github/workflows/deploy-pages.yml
name: Deploy Inspect logs to Pages
on:
  push:
    branches: [ logs ]  # or your branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build view bundle (optional, if not pre-built)
        run: |
          pipx install inspect-ai
          inspect view bundle --log-dir logs_raw --output-dir logs_gh_pages --overwrite
      - name: Ensure .nojekyll
        run: touch logs_gh_pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: logs_gh_pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
