[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mountain"
version = "0.1.0"
description = "A library for evaluating long-context capabilities and safety for LLMs"
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "anthropic>=0.64.0",
    "datasets>=3.2.0,<4.0.0",
    "inspect-ai>=0.3.120",
    "ipykernel>=6.30.0",
    "openai>=1.99.3",
    "python-dotenv>=1.1.1",
    "seaborn>=0.13.2",
    "tiktoken>=0.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
]

[tool.ruff]
exclude = [".venv", "assets", "configs", "logs", "notebooks"]
