[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mountain"
version = "0.1.0"
description = "A library for evaluating long-context capabilities and safety for LLMs"
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "datasets>=3.2.0,<4.0.0",
    "inspect-ai>=0.3.117",
    "ipykernel>=6.30.0",
    "openai>=1.98.0",
    "python-dotenv>=1.1.1",
    "seaborn>=0.13.2",
    "tiktoken>=0.9.0",
]

