[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "mountain"
version = "0.1.0"
description = "A library for evaluating long-context capabilities and safety degradation of AI Agents"
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "datasets>=3.2.0,<4.0.0",
    "google-genai>=1.31.0",
    "google-generativeai>=0.8.5",
    "inspect-ai>=0.3.120",
    "ipykernel>=6.30.0",
    "openai>=1.99.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.1.1",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tiktoken>=0.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
]

[project.entry-points.inspect_ai]
evals = "mountain._registry"

[tool.ruff]
line-length = 88
